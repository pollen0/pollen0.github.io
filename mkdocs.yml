site_name: Paul Lin
site_description: Training notes and weekly thoughts.
site_author: Paul Lin
site_url: https://pollen0.github.io/
repo_url: https://github.com/pollen0/pollen0.github.io
repo_name: pollen0/pollen0.github.io

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: white
      accent: indigo
  font:
    text: Inter
    code: "JetBrains Mono"

markdown_extensions:
  - admonition
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Training:
    - All training notes: training.md
    - Week 01 — Autograd & PyTorch: weeks/week-01.md
  - Compute:
    - State of Compute: compute/index.md
    - Ornn: compute/ornn.md
    - Silicon Data: compute/silicon-data.md
    - Why the benchmark: compute/why-the-benchmark.md
    - Why this market exists: compute/why-this-market-exists.md
  - Thoughts:
    - All thoughts: thoughts.md
    - Week 01: thoughts/week-01.md
  - About: about.md
